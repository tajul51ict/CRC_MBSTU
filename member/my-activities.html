<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Activities - CRC MBSTU</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container-fluid px-lg-4">
      <a class="navbar-brand" href="/member/dashboard.html">
        <i class="bi bi-heart-pulse-fill text-warning"></i>
        <span>CRC MBSTU</span>
        <span class="badge-accent">Member Portal</span>
      </a>
      <div class="ms-auto d-flex align-items-center gap-3">
        <a href="/index.html" class="btn btn-sm btn-outline-light d-none d-sm-inline-block">
          <i class="bi bi-globe me-1"></i> Public Site
        </a>
        <button id="btn-member-logout" class="btn btn-sm btn-outline-warning">
          <i class="bi bi-box-arrow-right me-1"></i> Logout
        </button>
      </div>
    </div>
  </nav>

  <!-- Member Dashboard Container -->
  <div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="dashboard-sidebar">
      <div class="user-profile-widget">
        <div class="user-avatar-placeholder">
          <i class="bi bi-person-fill"></i>
        </div>
        <h6 class="text-white mb-0">Volunteer Member</h6>
        <span class="badge bg-success mt-1">Active Volunteer</span>
      </div>
      <ul class="sidebar-nav">
        <li>
          <a href="/member/dashboard.html">
            <i class="bi bi-speedometer2"></i> Dashboard
          </a>
        </li>
        <li>
          <a href="/member/my-activities.html" class="active">
            <i class="bi bi-check2-circle"></i> My Activities
          </a>
        </li>
        <li>
          <a href="/activities.html">
            <i class="bi bi-compass"></i> Explore All Activities
          </a>
        </li>
        <li>
          <a href="/index.html">
            <i class="bi bi-house"></i> Home Page
          </a>
        </li>
      </ul>
    </aside>

    <!-- Content Area -->
    <main class="dashboard-content">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
          <h2 class="mb-1">My Joined Activities</h2>
          <p class="text-muted mb-0">List of all humanitarian campaigns and drives you have registered for.</p>
        </div>
        <a href="/activities.html" class="btn btn-primary-crc">
          <i class="bi bi-compass me-1"></i> Browse More Activities
        </a>
      </div>

      <div id="my-activities-container">
        <!-- Rendered dynamically via API -->
      </div>
    </main>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="/js/script.js"></script>
</body>
</html>
